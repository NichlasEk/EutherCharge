# RAM-only one-shot probe. Does not alter GPIO, clocks, flash or option bytes.
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0
set out build/kw520-board-probe/session-b
if {[file exists $out]} { error "Session already exists; preserve evidence" }
file mkdir $out
proc word {addr} { return [lindex [read_memory $addr 32 1] 0] }
proc wrreg {selector value} {
  write_memory 0xe000edf8 32 $value
  write_memory 0xe000edf4 32 [expr {0x10000 | $selector}]
  sleep 1
  for {set i 0} {$i < 100} {incr i} {
    if {([word 0xe000edf0] & 0x10000) != 0} { return }
    sleep 1
  }
  error "Core register write timeout"
}
proc rdreg {selector} {
  write_memory 0xe000edf4 32 $selector
  sleep 1
  for {set i 0} {$i < 100} {incr i} {
    if {([word 0xe000edf0] & 0x10000) != 0} { return [word 0xe000edf8] }
    sleep 1
  }
  error "Core register read timeout"
}
init
if {[word 0x40015800] != 0x50020100} { error "Wrong target identity" }
halt 500
poll off
# Snapshot before loading our code; ADC DMA may still update its own buffer.
dump_image $out/sram-before.bin 0x20000000 0x4000
dump_image $out/code-before.bin 0x20001a00 0x700
dump_image $out/mailbox-before.bin 0x20002100 0x100
set ok 0
set failure ""
catch {
  load_image build/kw520-board-probe/probe.bin 0x20001a00 bin
  verify_image build/kw520-board-probe/probe.bin 0x20001a00 bin
  write_memory 0x20002100 32 {0 0}
  write_memory 0xe000edf0 32 {0xa05f0003}
  sleep 10
  if {([word 0xe000edf0] & 0x30000) != 0x30000} { error "Core not ready and halted" }
  wrreg 0x11 0x20002300
  wrreg 0x12 0x20002300
  wrreg 0x14 0
  wrreg 0x10 0x01000000
  wrreg 0x0f 0x20001a00
  foreach {sel expected} {0x11 0x20002300 0x12 0x20002300 0x14 0 0x10 0x01000000 0x0f 0x20001a00} {
    set actual [rdreg $sel]
    puts [format "REG selector=%02x actual=%08x expected=%08x" $sel $actual $expected]
    if {$actual != $expected} { error "Core register readback mismatch" }
  }
  write_memory 0xe000edf0 32 {0xa05f0001}
  sleep 10
  puts [format "RUN_DHCSR=%08x" [word 0xe000edf0]]
  write_memory 0xe000edf0 32 {0xa05f0003}
  sleep 10
  if {([word 0xe000edf0] & 0x20000) == 0} { error "Core did not halt" }
  dump_image $out/report.bin 0x20002100 0x100
  puts [format "STOP_PC=%08x STOP_XPSR=%08x" [rdreg 0x0f] [rdreg 0x10]]
  set ok [expr {[word 0x20002100] == 0x4b575031 && [word 0x20002104] == 1}]
} failure
write_memory 0xe000edf0 32 {0xa05f0003}
sleep 10
if {([word 0xe000edf0] & 0x20000) == 0} { error "Cannot restore while core running" }
load_image $out/code-before.bin 0x20001a00 bin
verify_image $out/code-before.bin 0x20001a00 bin
load_image $out/mailbox-before.bin 0x20002100 bin
verify_image $out/mailbox-before.bin 0x20002100 bin
puts "BOARD_PROBE ok=$ok restored=1 detail=$failure"
puts "Cold power cycle required; core deliberately left halted"
shutdown
