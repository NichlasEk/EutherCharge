# MEM-AP reads only; debug attach still disturbs the protected original core.
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.mem mem_ap -dap kw520.dap -ap-num 0
if {![info exists capture_label]} { set capture_label live-a }
if {![regexp {^[a-z0-9-]+$} $capture_label]} { error "Invalid capture label" }
set out build/kw520-board-probe/$capture_label.txt
if {[file exists $out]} { error "Refusing to replace inventory" }
set fd [open $out w]
proc word {addr} { return [lindex [read_memory $addr 32 1] 0] }
proc record {name addr} {
  global fd
  set v [word $addr]
  set line [format "%s address=%08x value=%08x" $name $addr $v]
  puts $fd $line
  flush $fd
  puts $line
  return $v
}
init
set ac [record GPIOA_CFGR 0x48000000]
set ao [record GPIOA_ODT 0x48000014]
set bc [record GPIOB_CFGR 0x48000400]
set spi [record SPI2_CTRL1 0x40003800]
set id [record DEVICE_ID 0x40015800]
set live [expr {$id == 0x50020100 && (($ac >> 16) & 3) == 1 && ($ao & 0x100) != 0 && (($bc >> 26) & 0x3f) == 0x2a && ($spi & 0xffff) == 0x357}]
if {$live} {
  foreach {name addr} {
    CRM_CTRL 0x40021000 CRM_CFG 0x40021004
    CRM_AHBEN 0x40021014 CRM_APB2EN 0x40021018 CRM_APB1EN 0x4002101c
    GPIOA_OMODE 0x48000004 GPIOA_ODRV 0x48000008 GPIOA_PULL 0x4800000c
    GPIOA_IDT 0x48000010 GPIOA_MUXL 0x48000020 GPIOA_MUXH 0x48000024
    GPIOB_OMODE 0x48000404 GPIOB_ODRV 0x48000408 GPIOB_PULL 0x4800040c
    GPIOB_IDT 0x48000410 GPIOB_ODT 0x48000414
    GPIOB_MUXL 0x48000420 GPIOB_MUXH 0x48000424
    DMA1_CH1_CTRL 0x40020008 DMA1_CH1_COUNT 0x4002000c
    DMA1_CH1_PADDR 0x40020010 DMA1_CH1_MADDR 0x40020014
  } { record $name $addr }
  # Only inspect peripherals whose clocks are already enabled. Never enable
  # clocks or touch GPIO set/clear registers or ADC status/data registers.
  set ahben [record CRM_AHBEN_EXT 0x40021014]
  foreach {port base bit} {C 0x48000800 19 F 0x48001400 22} {
    if {$ahben & (1 << $bit)} {
      foreach {reg offset} {
        CFGR 0x00 OMODE 0x04 ODRV 0x08 PULL 0x0c
        IDT 0x10 ODT 0x14 MUXL 0x20 MUXH 0x24
      } { record GPIO${port}_$reg [expr {$base + $offset}] }
    } else {
      puts $fd "GPIO${port}_SKIPPED=clock-disabled"
    }
  }
  set apb2en [record CRM_APB2EN_EXT 0x40021018]
  if {$apb2en & (1 << 9)} {
    foreach {reg offset} {
      CTRL1 0x04 CTRL2 0x08 SPT1 0x0c SPT2 0x10
      OSQ1 0x2c OSQ2 0x30 OSQ3 0x34 PSQ 0x38
    } { record ADC1_$reg [expr {0x40012400 + $offset}] }
  } else {
    puts $fd "ADC1_SKIPPED=clock-disabled"
  }
  set final_spi [record SPI2_CTRL1_END 0x40003800]
  set final_ac [record GPIOA_CFGR_END 0x48000000]
  set live [expr {$final_spi == $spi && $final_ac == $ac}]
}
record DHCSR 0xe000edf0
puts $fd "LIVE_INVENTORY=$live"
close $fd
puts "LIVE_INVENTORY=$live"
shutdown
