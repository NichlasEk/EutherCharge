# Read-only SRAM/core/fault capture after one fixed KW520 frontier boot.
# This halts the core and therefore requires pointer recovery plus cold start.
if {![info exists ::env(KW520_FRONTIER_SRAM_OUTPUT)]} {
    error "KW520_FRONTIER_SRAM_OUTPUT is required"
}

adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

proc core_reg_read {selector} {
    write_memory 0xe000edf4 32 $selector
    sleep 1
    for {set index 0} {$index < 100} {incr index} {
        set dhcsr [lindex [read_memory 0xe000edf0 32 1] 0]
        if {($dhcsr & 0x00010000) != 0} {
            return [lindex [read_memory 0xe000edf8 32 1] 0]
        }
    }
    return -1
}

init
halt 500
poll off
set dhcsr [lindex [read_memory 0xe000edf0 32 1] 0]
set icsr [lindex [read_memory 0xe000ed04 32 1] 0]
set vtor [lindex [read_memory 0xe000ed08 32 1] 0]
set shcsr [lindex [read_memory 0xe000ed24 32 1] 0]
set cfsr [lindex [read_memory 0xe000ed28 32 1] 0]
set hfsr [lindex [read_memory 0xe000ed2c 32 1] 0]
set mmfar [lindex [read_memory 0xe000ed34 32 1] 0]
set bfar [lindex [read_memory 0xe000ed38 32 1] 0]
set msp [core_reg_read 0x11]
set psp [core_reg_read 0x12]
set special [core_reg_read 0x14]
set xpsr [core_reg_read 0x10]
set pc [core_reg_read 0x0f]
set lr [core_reg_read 0x0e]
puts [format "FRONTIER_CORE dhcsr=%08x icsr=%08x vtor=%08x shcsr=%08x cfsr=%08x hfsr=%08x mmfar=%08x bfar=%08x msp=%08x psp=%08x special=%08x xpsr=%08x pc=%08x lr=%08x" $dhcsr $icsr $vtor $shcsr $cfsr $hfsr $mmfar $bfar $msp $psp $special $xpsr $pc $lr]
dump_image $::env(KW520_FRONTIER_SRAM_OUTPUT) 0x20000000 0x4000
puts "FRONTIER_CAPTURE=PASS"
shutdown
