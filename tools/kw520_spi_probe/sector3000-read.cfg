# Fixed read-only one-shot: JEDEC gate, then EN25Q32 sector 0x003000.
# Set KW520_JLINK_SERIAL in the environment before invoking OpenOCD.
adapter driver jlink
if {![info exists ::env(KW520_JLINK_SERIAL)]} {
    error "KW520_JLINK_SERIAL is required"
}
adapter serial $::env(KW520_JLINK_SERIAL)
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

set evidence_dir build/kw520-jlink-20261031

proc core_reg_write {selector value} {
    write_memory 0xe000edf8 32 $value
    write_memory 0xe000edf4 32 [expr {0x00010000 | $selector}]
    sleep 1
    for {set i 0} {$i < 100} {incr i} {
        set dhcsr [lindex [read_memory 0xe000edf0 32 1] 0]
        if {($dhcsr & 0x00010000) != 0} { return 1 }
    }
    return 0
}

proc core_reg_read {selector} {
    write_memory 0xe000edf4 32 $selector
    sleep 1
    for {set i 0} {$i < 100} {incr i} {
        set dhcsr [lindex [read_memory 0xe000edf0 32 1] 0]
        if {($dhcsr & 0x00010000) != 0} {
            return [lindex [read_memory 0xe000edf8 32 1] 0]
        }
    }
    return -1
}

init
halt 500

set acfgr [lindex [read_memory 0x48000000 32 1] 0]
set aodt [lindex [read_memory 0x48000014 32 1] 0]
set bcfgr [lindex [read_memory 0x48000400 32 1] 0]
set ctrl1 [lindex [read_memory 0x40003800 32 1] 0]
set sts [lindex [read_memory 0x40003808 32 1] 0]
set ahben [lindex [read_memory 0x40021014 32 1] 0]
set apb1en [lindex [read_memory 0x4002101c 32 1] 0]
puts [format "LIVE_REGS acfgr=%08x aodt=%08x bcfgr=%08x ctrl1=%08x sts=%08x ahben=%08x apb1en=%08x" $acfgr $aodt $bcfgr $ctrl1 $sts $ahben $apb1en]

set live_ok [expr {
    (($acfgr >> 16) & 3) == 1 &&
    ($aodt & 0x100) != 0 &&
    (($bcfgr >> 26) & 3) == 2 &&
    (($bcfgr >> 28) & 3) == 2 &&
    (($bcfgr >> 30) & 3) == 2 &&
    ($ctrl1 & 0xffff) == 0x357 &&
    ($sts & 2) != 0 &&
    ($ahben & 0x40000) != 0 &&
    ($apb1en & 0x4000) != 0
}]

if {!$live_ok} {
    puts "REFUSED: live PA8/SPI2 configuration is not present"
    shutdown
}

poll off
dump_image $evidence_dir/spi-sector3000-code-backup.bin 0x20001a00 0x500
dump_image $evidence_dir/spi-sector3000-mailbox-backup.bin 0x20001f00 0x80
dump_image $evidence_dir/spi-sector3000-buffer-backup.bin 0x20000a00 0x1000
dump_image $evidence_dir/spi-sector3000-stack-backup.bin 0x200022c0 0x40
load_image build/kw520-spi-probe/sector_probe.bin 0x20001a00 bin
set old_vtor [read_memory 0xe000ed08 32 1]
write_memory 0x20001f30 32 $old_vtor
write_memory 0x20001f08 32 {5}

write_memory 0xe000edf0 32 {0xa05f0003}
sleep 10
set dhcsr_halted [lindex [read_memory 0xe000edf0 32 1] 0]
set core_ok [expr {($dhcsr_halted & 0x00030000) == 0x00030000}]
if {$core_ok} { set core_ok [core_reg_write 0x11 0x20002300] }
if {$core_ok} { set core_ok [core_reg_write 0x12 0x20002300] }
if {$core_ok} { set core_ok [core_reg_write 0x14 0x00000000] }
if {$core_ok} { set core_ok [core_reg_write 0x10 0x01000000] }
if {$core_ok} { set core_ok [core_reg_write 0x0f 0x20001a40] }

set read_msp [core_reg_read 0x11]
set read_psp [core_reg_read 0x12]
set read_special [core_reg_read 0x14]
set read_xpsr [core_reg_read 0x10]
set read_pc [core_reg_read 0x0f]
puts [format "CORE_REGS msp=%08x psp=%08x special=%08x xpsr=%08x pc=%08x" $read_msp $read_psp $read_special $read_xpsr $read_pc]
set core_ok [expr {$core_ok && $read_msp == 0x20002300 && $read_psp == 0x20002300 && $read_special == 0 && $read_xpsr == 0x01000000 && $read_pc == 0x20001a40}]

set dhcsr_running 0
set read_done 0
if {$core_ok} {
    write_memory 0xe000edf0 32 {0xa05f0001}
    sleep 25
    set dhcsr_running [lindex [read_memory 0xe000edf0 32 1] 0]
    if {($dhcsr_running & 0x00020000) == 0} {
        for {set i 0} {$i < 100} {incr i} {
            set state [lindex [read_memory 0x20001f04 32 1] 0]
            if {$state == 0x21} {
                set read_done 1
                break
            }
            if {$state >= 0xe0} { break }
            sleep 10
        }
    } else {
        set core_ok 0
        puts "REFUSED: C_HALT/S_HALT did not clear after direct run request"
    }
    write_memory 0xe000edf0 32 {0xa05f0003}
    sleep 10
} else {
    puts "REFUSED: direct halt or verified core-register transfer failed"
}

set dhcsr_after [lindex [read_memory 0xe000edf0 32 1] 0]
set magic [lindex [read_memory 0x20001f00 32 1] 0]
set state [lindex [read_memory 0x20001f04 32 1] 0]
set command [lindex [read_memory 0x20001f08 32 1] 0]
set source [lindex [read_memory 0x20001f0c 32 1] 0]
set requested [lindex [read_memory 0x20001f10 32 1] 0]
set completed [lindex [read_memory 0x20001f14 32 1] 0]
set id0 [lindex [read_memory 0x20001f18 32 1] 0]
set id1 [lindex [read_memory 0x20001f1c 32 1] 0]
set id2 [lindex [read_memory 0x20001f20 32 1] 0]
puts [format "SECTOR3000 core_ok=%u done=%u dhcsr_before=%08x dhcsr_running=%08x dhcsr_after=%08x magic=%08x state=%08x command=%08x id=%02x%02x%02x source=%06x requested=%u completed=%u" $core_ok $read_done $dhcsr_halted $dhcsr_running $dhcsr_after $magic $state $command $id0 $id1 $id2 $source $requested $completed]
if {$core_ok && $read_done && $magic == 0x4b575350 && $state == 0x21 && $command == 0 && $id0 == 0x1c && $id1 == 0x30 && $id2 == 0x16 && $source == 0x3000 && $requested == 0x1000 && $completed == 0x1000} {
    dump_image $evidence_dir/spi-sector3000-readback.bin 0x20000a00 0x1000
} else {
    puts "REFUSED: fixed JEDEC plus sector-0x3000 gate did not pass"
}

write_memory 0xe000ed08 32 $old_vtor
dump_image $evidence_dir/spi-sector3000-helper-readback.bin 0x20001a00 0x418
load_image $evidence_dir/spi-sector3000-code-backup.bin 0x20001a00 bin
load_image $evidence_dir/spi-sector3000-mailbox-backup.bin 0x20001f00 bin
load_image $evidence_dir/spi-sector3000-buffer-backup.bin 0x20000a00 bin
load_image $evidence_dir/spi-sector3000-stack-backup.bin 0x200022c0 bin
dump_image $evidence_dir/spi-sector3000-code-restored.bin 0x20001a00 0x500
dump_image $evidence_dir/spi-sector3000-mailbox-restored.bin 0x20001f00 0x80
dump_image $evidence_dir/spi-sector3000-buffer-restored.bin 0x20000a00 0x1000
dump_image $evidence_dir/spi-sector3000-stack-restored.bin 0x200022c0 0x40
puts [format "RESTORED_VTOR=0x%08x" [lindex $old_vtor 0]]
shutdown
