# One-candidate SRAM-to-SRAM gate. The oracle itself fixes source and
# destination to SRAM and MPU-isolates index 18 (0x0800ad8f).
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

if {![info exists ::env(KW520_ORACLE_OUT_DIR)]} {
    error "KW520_ORACLE_OUT_DIR is required"
}
set out $::env(KW520_ORACLE_OUT_DIR)

init
halt 500
set old_vtor [lindex [read_memory 0xe000ed08 32 1] 0]
dump_image "$out/sram-backup.bin" 0x20001000 0x1300
load_image build/kw520-call-oracle/oracle.bin 0x20001000 bin
dump_image "$out/oracle-readback.bin" 0x20001000 0x35c

reg sp 0x20002300
reg pc 0x20001041
reg xpsr 0x01000000
resume
sleep 50
halt 500
set alive [read_memory 0x20001700 32 20]
set alive_magic [lindex $alive 0]
set alive_state [lindex $alive 1]
set mpu_type [lindex $alive 6]
set regions [expr {($mpu_type >> 8) & 0xff}]
set alive_ok [expr {$alive_magic == 0x4b57434f && $alive_state == 1 && $regions == 8}]

if {$alive_ok} {
    write_memory 0x20001708 32 {0x43414c4c}
    write_memory 0x20001710 32 {18}
    write_memory 0x2000170c 32 {2}
    resume
    sleep 50
    halt 500
}

set result [read_memory 0x20001700 32 20]
set magic [lindex $result 0]
set state [lindex $result 1]
set command [lindex $result 3]
set index [lindex $result 4]
set candidate [lindex $result 5]
set result_r0 [lindex $result 8]
set matched [lindex $result 9]
set cfsr [lindex $result 10]
set hfsr [lindex $result 11]
set mmfar [lindex $result 12]
set bfar [lindex $result 13]
set stacked_pc [lindex $result 14]
set stacked_lr [lindex $result 15]
set guard_before [lindex $result 16]
set guard_after [lindex $result 17]
set phase [lindex $result 18]
set address_ok [expr {$alive_ok && $magic == 0x4b57434f && $index == 18 && $candidate == 0x0800ad8f}]

puts [format "ORACLE_CANDIDATE alive=%u magic=%08x state=%08x command=%u index=%u candidate=%08x result_r0=%08x matched=%u cfsr=%08x hfsr=%08x mmfar=%08x bfar=%08x stacked_pc=%08x stacked_lr=%08x guard_before=%08x guard_after=%08x phase=%08x address_ok=%u" $alive_ok $magic $state $command $index $candidate $result_r0 $matched $cfsr $hfsr $mmfar $bfar $stacked_pc $stacked_lr $guard_before $guard_after $phase $address_ok]
if {$address_ok && $state == 0x31 && $matched == 32 && $guard_before == 0xdeadbeef && $guard_after == 0xbaadf00d} {
    puts "ORACLE_OUTCOME exact-copy"
} elseif {$address_ok && $state == 0x32} {
    puts "ORACLE_OUTCOME returned-mismatch"
} elseif {$address_ok && $state == 0xf0} {
    puts "ORACLE_OUTCOME contained-fault"
} elseif {$address_ok && $state == 0x21} {
    puts "ORACLE_OUTCOME contained-timeout"
} else {
    puts "ORACLE_OUTCOME refused"
}
dump_image "$out/oracle-data.bin" 0x20001800 0x200

# Cleanup is unconditional, including timeout/fault cases.
write_memory 0xe000ed94 32 {0}
write_memory 0xe000ed08 32 [list $old_vtor]
load_image "$out/sram-backup.bin" 0x20001000 bin
dump_image "$out/sram-restored.bin" 0x20001000 0x1300
puts [format "RESTORED_VTOR=0x%08x" $old_vtor]
shutdown
