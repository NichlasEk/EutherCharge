# Phase 1: arm fixed candidate 18, prove the helper is waiting for C_DEBUGEN
# to clear, then resume and disconnect. No result readback or SRAM restore here.
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

if {![info exists ::env(KW520_ORACLE_OUT_DIR)]} {
    error "KW520_ORACLE_OUT_DIR is required"
}
set out $::env(KW520_ORACLE_OUT_DIR)

init
halt 500
set old_vtor [lindex [read_memory 0xe000ed08 32 1] 0]
dump_image "$out/sram-backup.bin" 0x20001000 0x1300
load_image build/kw520-call-oracle/oracle.bin 0x20001000 bin
dump_image "$out/oracle-readback.bin" 0x20001000 0x35c

reg sp 0x20002300
reg pc 0x20001041
reg xpsr 0x01000000
resume
sleep 50
halt 500
set alive [read_memory 0x20001700 32 20]
set alive_ok [expr {[lindex $alive 0] == 0x4b57434f && [lindex $alive 1] == 1 && [lindex $alive 6] == 0x00000800}]
if {$alive_ok && $old_vtor == 0x08000000} {
    write_memory 0x20001708 32 {0x43414c4c}
    write_memory 0x20001710 32 {18}
    write_memory 0x2000170c 32 {3}
    resume
    sleep 20
    halt 500
}

set armed [read_memory 0x20001700 32 20]
set magic [lindex $armed 0]
set state [lindex $armed 1]
set command [lindex $armed 3]
set index [lindex $armed 4]
set candidate [lindex $armed 5]
set arm_ok [expr {$alive_ok && $old_vtor == 0x08000000 && $magic == 0x4b57434f && $state == 0x40 && $command == 3 && $index == 18 && $candidate == 0x0800ad8f}]
puts [format "DETACH_ARM old_vtor=%08x magic=%08x state=%08x command=%u index=%u candidate=%08x arm_ok=%u" $old_vtor $magic $state $command $index $candidate $arm_ok]
if {$arm_ok} {
    puts "ACCEPTED: candidate 18 is waiting for debug detach"
    resume
    sleep 10
    write_memory 0xe000edf0 32 {0xa05f0000}
    kw520.dap dpreg 4 0x40000000
    set release_status [kw520.dap dpreg 4]
    puts "DETACH_RELEASE status=$release_status"
} else {
    puts "REFUSED: detach arm gate did not pass"
}
shutdown
