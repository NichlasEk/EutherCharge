# Phase 2: reconnect after the detached interval, capture the fixed mailbox and
# SRAM buffers, disable MPU, then restore VTOR and all affected SRAM bytes.
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

if {![info exists ::env(KW520_ORACLE_OUT_DIR)]} {
    error "KW520_ORACLE_OUT_DIR is required"
}
set out $::env(KW520_ORACLE_OUT_DIR)

init
halt 500
puts "DETACH_CORE_PC: [reg pc]"
puts "DETACH_CORE_XPSR: [reg xpsr]"
puts "DETACH_CORE_MSP: [reg msp]"
puts "DETACH_CORE_PSP: [reg psp]"
set result [read_memory 0x20001700 32 20]
set magic [lindex $result 0]
set state [lindex $result 1]
set command [lindex $result 3]
set index [lindex $result 4]
set candidate [lindex $result 5]
set result_r0 [lindex $result 8]
set matched [lindex $result 9]
set cfsr [lindex $result 10]
set hfsr [lindex $result 11]
set mmfar [lindex $result 12]
set bfar [lindex $result 13]
set stacked_pc [lindex $result 14]
set stacked_lr [lindex $result 15]
set guard_before [lindex $result 16]
set guard_after [lindex $result 17]
set phase [lindex $result 18]
set address_ok [expr {$magic == 0x4b57434f && $index == 18 && $candidate == 0x0800ad8f}]
puts [format "DETACH_RESULT magic=%08x state=%08x command=%u index=%u candidate=%08x result_r0=%08x matched=%u cfsr=%08x hfsr=%08x mmfar=%08x bfar=%08x stacked_pc=%08x stacked_lr=%08x guard_before=%08x guard_after=%08x phase=%08x address_ok=%u" $magic $state $command $index $candidate $result_r0 $matched $cfsr $hfsr $mmfar $bfar $stacked_pc $stacked_lr $guard_before $guard_after $phase $address_ok]
if {$address_ok && $state == 0x31 && $matched == 32 && $guard_before == 0xdeadbeef && $guard_after == 0xbaadf00d} {
    puts "DETACH_OUTCOME exact-copy"
} elseif {$address_ok && $state == 0x32} {
    puts "DETACH_OUTCOME returned-mismatch"
} elseif {$address_ok && $state == 0xf0} {
    puts "DETACH_OUTCOME contained-fault"
} elseif {$address_ok && $state == 0x21} {
    puts "DETACH_OUTCOME no-return-after-branch"
} elseif {$address_ok && $state == 0x40} {
    puts "DETACH_OUTCOME debug-never-detached"
} else {
    puts "DETACH_OUTCOME refused"
}
dump_image "$out/oracle-data.bin" 0x20001800 0x200

write_memory 0xe000ed94 32 {0}
write_memory 0xe000ed08 32 {0x08000000}
load_image "$out/sram-backup.bin" 0x20001000 bin
dump_image "$out/sram-restored.bin" 0x20001000 0x1300
puts "RESTORED_VTOR=0x08000000"
shutdown
