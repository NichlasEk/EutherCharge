# Inventory-only gate for the KW520 call oracle. This configuration runs only
# command 1; it never arms or invokes a main-flash candidate and never reads the
# protected flash range.
adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.cpu cortex_m -dap kw520.dap -ap-num 0

if {![info exists ::env(KW520_ORACLE_OUT_DIR)]} {
    error "KW520_ORACLE_OUT_DIR is required"
}
set out $::env(KW520_ORACLE_OUT_DIR)

init
halt 500
set old_vtor [lindex [read_memory 0xe000ed08 32 1] 0]
dump_image "$out/sram-backup.bin" 0x20001000 0x1300
load_image build/kw520-call-oracle/oracle.bin 0x20001000 bin
dump_image "$out/oracle-readback.bin" 0x20001000 0x35c

reg sp 0x20002300
reg pc 0x20001041
reg xpsr 0x01000000
resume
sleep 50
halt 500
set alive [read_memory 0x20001700 32 20]
set alive_magic [lindex $alive 0]
set alive_state [lindex $alive 1]
set alive_ok [expr {$alive_magic == 0x4b57434f && $alive_state == 1}]

if {$alive_ok} {
    write_memory 0x2000170c 32 {1}
    resume
    sleep 20
    halt 500
}

set result [read_memory 0x20001700 32 20]
set magic [lindex $result 0]
set state [lindex $result 1]
set command [lindex $result 3]
set candidate [lindex $result 5]
set mpu_type [lindex $result 6]
set mpu_before [lindex $result 7]
set count [lindex $result 19]
set regions [expr {($mpu_type >> 8) & 0xff}]
set inventory_ok [expr {$alive_ok && $magic == 0x4b57434f && $state == 0x10 && $command == 0 && $candidate == 0 && $count == 19}]
set call_guard_ok [expr {$inventory_ok && $regions >= 6}]
puts [format "ORACLE_INVENTORY alive=%u magic=%08x state=%08x command=%u candidate=%08x mpu_type=%08x mpu_before=%08x regions=%u count=%u inventory_ok=%u call_guard_ok=%u" $alive_ok $magic $state $command $candidate $mpu_type $mpu_before $regions $count $inventory_ok $call_guard_ok]

write_memory 0xe000ed08 32 [list $old_vtor]
load_image "$out/sram-backup.bin" 0x20001000 bin
dump_image "$out/sram-restored.bin" 0x20001000 0x1300
puts [format "RESTORED_VTOR=0x%08x" $old_vtor]
if {$inventory_ok} {
    puts "ACCEPTED: MPU inventory completed without arming a candidate"
} else {
    puts "REFUSED: MPU inventory gate did not pass"
}
shutdown
