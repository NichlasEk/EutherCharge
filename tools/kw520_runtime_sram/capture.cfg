# Read-only full SRAM capture of the running KW520 firmware state.
# Debug initialization freezes the protected original firmware; cold-start it
# after capture. This configuration performs no target SRAM or flash writes.

if {![info exists ::env(KW520_RUNTIME_SRAM_OUTPUT)]} {
    error "KW520_RUNTIME_SRAM_OUTPUT is required"
}

adapter driver jlink
adapter serial 69401338
transport select swd
adapter speed 50
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled

swd newdap kw520 cpu
dap create kw520.dap -chain-position kw520.cpu
target create kw520.mem mem_ap -dap kw520.dap -ap-num 0

init
puts "DHCSR: [mdw 0xe000edf0 1]"
puts "ICSR: [mdw 0xe000ed04 1]"
dump_image $::env(KW520_RUNTIME_SRAM_OUTPUT) 0x20000000 0x4000
puts "RUNTIME_SRAM_CAPTURE=PASS"
shutdown
